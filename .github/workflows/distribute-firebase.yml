name: Distribute to Firebase

on:
  workflow_dispatch: # Manual only

jobs:
  build-and-distribute:
    name: Build & Upload to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android (preview)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait \
            --json > build.json

          BUILD_ID=$(jq -r '.[0].id' build.json)
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV

      - name: Wait for build & download APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Waiting for build $BUILD_ID to finish..."

          for i in {1..80}; do
            STATUS=$(eas build:view "$BUILD_ID" --json | jq -r '.status' | tr '[:upper:]' '[:lower:]')
            echo "Attempt $i - Status: $STATUS"

            if [ "$STATUS" = "finished" ]; then
              echo "✅ Build finished successfully"
              break
            fi

            if [ "$STATUS" = "errored" ] || [ "$STATUS" = "canceled" ]; then
              echo "❌ Build failed with status: $STATUS"
              exit 1
            fi

            sleep 20
          done

          if [ "$STATUS" != "finished" ]; then
            echo "❌ Timed out waiting for build"
            exit 1
          fi

          echo "Getting download URL..."
          BUILD_URL=$(eas build:view "$BUILD_ID" --json | jq -r '.artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty')

          if [ -z "$BUILD_URL" ] || [ "$BUILD_URL" = "null" ]; then
            echo "❌ Could not find build download URL"
            eas build:view "$BUILD_ID" --json
            exit 1
          fi

          echo "Downloading APK from: $BUILD_URL"
          curl -L "$BUILD_URL" -o app-release.apk
          ls -lh app-release.apk
          echo "✅ APK downloaded successfully"

      - name: Upload to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: app-release.apk
          releaseNotes: "Manual build from GitHub Actions"
